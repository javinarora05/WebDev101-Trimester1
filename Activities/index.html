<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            color: #00ff88;
            font-size: 48px;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .activity-btn {
            background: #1a1f3a;
            color: #00ff88;
            border: 2px solid #00ff88;
            padding: 30px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .activity-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8), 0 0 50px rgba(0, 255, 136, 0.4);
            background: #00ff88;
            color: #0a0e27;
            border-color: #00ff88;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }
            
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Activities</h1>
    
    <div class="container">
        <a href="firstpage.html" class="activity-btn">first Webpage</a>
        <a href="about_me.html" class="activity-btn">about me</a>
        <a href="contact_form.html" class="activity-btn">contact form</a>
        <a href="dog_gallery.html" class="activity-btn">Dog Gallery</a>
        <a href="ferris_wheel.html" class="activity-btn">ferris Wheel</a>
        <a href="moon_orbit.html" class="activity-btn">Moon Orbit</a>
        <a href="movie_collection.html" class="activity-btn">Movie Collection</a>
        <a href="profile-card.html" class="activity-btn">Profile Card</a>
        <a href="recipe.html" class="activity-btn">recipe</a>
        <a href="semantic.html" class="activity-btn">Semantic</a>
        <a href="weekend_plans.html" class="activity-btn">Weekend Plans</a>
        <a href="shapes/circle.html" class="activity-btn">Circle</a>
        <a href="shapes/diamond.html" class="activity-btn">Diamond</a>
        <a href="shapes/rectangle.html" class="activity-btn">Rectangle</a>
        <a href="shapes/square.html" class="activity-btn">Square</a>
        <a href="shapes/triangle.html" class="activity-btn">Triangle</a>
    </div>
</body>
</html>
