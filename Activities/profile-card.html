<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
    body {
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f4f8;
}

.card {
    display: flex;
    flex-direction: row;
    align-items: center;
    width: 500px;
    margin:auto;
    padding: 40px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
}

.profile--image {
    flex-shrink: 0; 
}

.profile--image img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #eef4f8; 
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}

.profile--heading {
    grid-area: heading; 
    text-align: center;
    margin-top: 15px;
}

.profile--content {
    margin-left: 50px; 
    text-align: left;
}

.profile--content h2 {
    font-size: 2.0rem;
    font-weight: bold;
    margin: 0;
    color: #2c3e50;
}

.profile-content p {
    font-size: 1rem;
    color: #7f8c8d;
    line-height: 1.6;
    margin-top: 10px;
}

.buttons--container {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

.butn {
    padding: 14px 28px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.butn:hover {
    color:#F2F2F2;
    background-color:#2B2B48;
    transition: background-color 0.15s,
    color 0.15s;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
}

@media (max-width: 640px) {
    .card {
        flex-direction: column;
        text-align: center;
        width: 70vw;
        padding: 30px 20px;
    }

    .profile--image img {
         width: 120px;
        height: 120px;
        margin-bottom: 30px;
    }

    .profile--content {
        margin-left: 5px;
    }

    .profile--content h2 {
        font-size: 1.8rem;
    }

    .profile--content p {
        font-size: 0.9rem;
    }

    .buttons--container {
        flex-direction: column;
        gap: 12px;
        width: 100%;
        margin-top: 25px;
    }
}
    </style>
</head>
